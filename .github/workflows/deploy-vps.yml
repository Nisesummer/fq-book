# 将 docs/ 静态站点（docsify）通过 SSH + rsync 部署到 VPS
#
# 需要在 仓库 Settings → Secrets and variables → Actions 中配置：
#   VPS_HOST         VPS 地址，例如 104.233.217.92
#   VPS_USER         SSH 登录用户，例如 root 或 deploy
#   VPS_SSH_KEY      该用户的 SSH 私钥（完整内容，含 BEGIN/END 行）
# 可选：
#   VPS_PORT         SSH 端口，默认 27124
#   VPS_PATH         站点目录，默认 /var/www/fq-book
#   VPS_KNOWN_HOSTS  `ssh-keyscan -p 27124 <host>` 的输出；不填则在运行时自动扫描

name: Deploy to VPS

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '27124' }}
      VPS_PATH: ${{ secrets.VPS_PATH || '/var/www/fq-book' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::缺少 VPS_HOST / VPS_USER / VPS_SSH_KEY secrets"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync docs/ to VPS
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $VPS_PORT -o StrictHostKeyChecking=yes"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH'"
          rsync -az --delete -e "$SSH" docs/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          echo "已部署到 $VPS_HOST:$VPS_PATH"
